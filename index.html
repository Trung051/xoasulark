<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dọn dẹp</title>
  <!-- Nạp SDK qua jsDelivr (ổn định nhất tại VN, ít bị chặn CORS) -->
  <script src="https://cdn.jsdelivr.net/npm/@lark-base-open/js-sdk@0.5.15/dist/index.umd.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 14px; margin: 0; background: #fff; }
    button { width: 100%; padding: 11px; background: #d83931; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; }
    button:disabled { background: #bbbfc4; cursor: not-allowed; }
    #log { margin-top: 12px; padding: 10px; background: #f5f6f7; border: 1px solid #dee0e3; border-radius: 6px; font-size: 12px; max-height: 240px; overflow-y: auto; white-space: pre-wrap; line-height: 1.5; }
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 9999; align-items: center; justify-content: center; }
    .modal-box { background: #fff; padding: 18px; border-radius: 8px; width: 85%; max-width: 300px; text-align: center; }
    .modal-box h4 { margin: 0 0 10px; font-size: 15px; }
    .modal-box p { margin: 0 0 15px; font-size: 13px; color: #646a73; }
    .modal-actions { display: flex; gap: 8px; }
    .modal-actions button { flex: 1; padding: 8px; border-radius: 4px; font-size: 13px; }
  </style>
</head>
<body>
  <button id="btn-run" onclick="startScan()">Quét & Xóa (v1.5)</button>
  <div id="log">Đang kiểm tra môi trường SDK...</div>

  <div id="modalBox" class="modal-overlay">
    <div class="modal-box">
      <h4>Xác nhận xóa</h4>
      <p id="modal-msg"></p>
      <div class="modal-actions">
        <button onclick="closeModal()" style="background:#f2f3f5; color:#1f2329; border:1px solid #dee0e3;">Hủy</button>
        <button onclick="executeDelete()" style="background:#d83931; color:#fff;">Đồng ý</button>
      </div>
    </div>
  </div>

  <script>
    const logEl = document.getElementById('log');
    let toDeleteList = [];
    let curTable = null;
    let bitableInstance = null;

    function writeLog(msg) {
      logEl.innerText += '\n' + msg;
      logEl.scrollTop = logEl.scrollHeight;
    }

    function closeModal() {
      document.getElementById('modalBox').style.display = 'none';
      document.getElementById('btn-run').disabled = false;
      writeLog('Đã hủy thao tác.');
    }

    // Cơ chế phát hiện SDK đa tầng
    function findBitable() {
      if (window.bitable) return window.bitable;
      if (window.bitableSDK && window.bitableSDK.bitable) return window.bitableSDK.bitable;
      if (window.BitableSDK && window.BitableSDK.bitable) return window.BitableSDK.bitable;
      try {
        if (window.parent && window.parent.bitable) return window.parent.bitable;
        if (window.parent && window.parent.bitableSDK && window.parent.bitableSDK.bitable) return window.parent.bitableSDK.bitable;
      } catch (e) {}
      return null;
    }

    // Tự động kiểm tra SDK khi vừa mở Extension
    window.addEventListener('DOMContentLoaded', () => {
      let attempts = 0;
      const timer = setInterval(() => {
        attempts++;
        bitableInstance = findBitable();
        if (bitableInstance) {
          clearInterval(timer);
          logEl.innerText = 'Sẵn sàng! SDK đã kết nối thành công. (v1.5)';
        } else if (attempts >= 20) {
          clearInterval(timer);
          logEl.innerText = 'Cảnh báo: Chưa nhận diện được SDK trực tiếp. Vẫn có thể bấm nút để thử kích hoạt.';
        }
      }, 200);
    });

    async function startScan() {
      const btn = document.getElementById('btn-run');
      btn.disabled = true;
      logEl.innerText = 'Đang kích hoạt SDK...';

      if (!bitableInstance) {
        bitableInstance = findBitable();
      }

      if (!bitableInstance) {
        writeLog('LỖI: Trình duyệt chặn nạp SDK hoặc CSP iframe từ chối nạp script ngoài.');
        writeLog('Chi tiết window keys: ' + Object.keys(window).filter(k => k.toLowerCase().includes('bitable')).join(', '));
        btn.disabled = false;
        return;
      }

      try {
        writeLog('Đang kết nối vào bảng Base...');
        curTable = await bitableInstance.base.getActiveTable();
        const tableName = await curTable.getName();
        writeLog(`Bảng hiện tại: [${tableName}]`);

        const fields = await curTable.getFieldList();
        const targetCol = fields.find(f => f.name.includes('Hết hạn (Xóa)'));

        if (!targetCol) {
          writeLog('LỖI: Không tìm thấy cột [Hết hạn (Xóa)]');
          btn.disabled = false;
          return;
        }

        const ids = await curTable.getRecordIdList();
        writeLog(`Tổng dòng: ${ids.length}. Đang kiểm tra...`);
        toDeleteList = [];

        for (const id of ids) {
          let text = '';
          try {
            text = await curTable.getCellString(targetCol.id, id);
          } catch(e) {}

          if (!text) {
            try {
              const raw = await targetCol.getValue(id);
              if (typeof raw === 'string') text = raw;
              else if (Array.isArray(raw)) text = raw.map(x => x?.text || '').join('');
              else if (raw && typeof raw === 'object') text = raw.text || JSON.stringify(raw);
            } catch(e) {}
          }

          if (text && text.trim().includes('Xóa')) {
            toDeleteList.push(id);
          }
        }

        if (toDeleteList.length === 0) {
          writeLog('Quét xong. Không có dòng nào có chữ "Xóa".');
          btn.disabled = false;
          return;
        }

        // Mở popup xác nhận
        document.getElementById('modal-msg').innerHTML = `Tìm thấy <b>${toDeleteList.length}</b> dòng có chữ "Xóa".<br>Xóa vĩnh viễn các dòng này?`;
        document.getElementById('modalBox').style.display = 'flex';
      } catch (err) {
        writeLog('Lỗi: ' + (err.message || JSON.stringify(err)));
        btn.disabled = false;
      }
    }

    async function executeDelete() {
      document.getElementById('modalBox').style.display = 'none';
      writeLog(`Bắt đầu xóa ${toDeleteList.length} dòng...`);
      let count = 0;

      for (const id of toDeleteList) {
        try {
          await curTable.deleteRecord(id);
          count++;
        } catch (e) {
          try {
            await curTable.deleteRecords([id]);
            count++;
          } catch (e2) {
            writeLog(`Lỗi xóa dòng ${id}: ${e2.message || e2}`);
          }
        }
      }

      writeLog(`HOÀN TẤT: Đã xóa thành công ${count}/${toDeleteList.length} dòng.`);
      document.getElementById('btn-run').disabled = false;
    }
  </script>
</body>
</html>
