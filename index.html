<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dọn dẹp bản ghi hết hạn</title>
  <script src="https://unpkg.com/@lark-base-open/js-sdk@0.5.15/dist/index.umd.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
      margin: 0;
      background: #fff;
      color: #1f2329;
    }
    h3 { margin: 0 0 8px 0; font-size: 16px; font-weight: 600; }
    p { margin: 0 0 14px 0; font-size: 13px; color: #646a73; line-height: 1.4; }
    button {
      width: 100%;
      padding: 11px;
      background: #d83931;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { background: #bbbfc4; cursor: not-allowed; }
    #log {
      margin-top: 14px;
      padding: 10px;
      background: #f5f6f7;
      border: 1px solid #dee0e3;
      border-radius: 6px;
      font-size: 12px;
      max-height: 250px;
      overflow-y: auto;
      white-space: pre-wrap;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <h3>Dọn dẹp bản ghi hết hạn</h3>
  <p>Tự động quét cột <b>[Hết hạn (Xóa)]</b> có chữ <b>"Xóa"</b> và xóa trực tiếp.</p>
  <button id="btn-del">Xóa các dòng quá hạn</button>
  <div id="log">Sẵn sàng...</div>

  <script>
    const bitable = window.bitableSDK.bitable;
    const btn = document.getElementById('btn-del');
    const logEl = document.getElementById('log');

    function print(msg) {
      logEl.innerText += '\n' + msg;
      logEl.scrollTop = logEl.scrollHeight;
    }

    btn.onclick = async () => {
      try {
        btn.disabled = true;
        logEl.innerText = 'Đang kết nối bảng...';

        // Lấy đúng bảng hiện tại đang hiển thị
        const table = await bitable.base.getActiveTable();
        const fieldList = await table.getFieldList();

        // Tìm trường cột [Hết hạn (Xóa)]
        const targetField = fieldList.find(f => f.name.includes('Hết hạn (Xóa)'));
        if (!targetField) {
          print('LỖI: Không tìm thấy cột [Hết hạn (Xóa)]');
          btn.disabled = false;
          return;
        }

        print('Đang lấy danh sách các dòng...');
        const recordIds = await table.getRecordIdList();
        print(`Tìm thấy tổng cộng ${recordIds.length} dòng.`);

        const toDelete = [];

        for (const id of recordIds) {
          let text = '';
          try {
            // Lấy trực tiếp văn bản hiển thị từ cột công thức
            text = await table.getCellString(targetField.id, id);
          } catch (e) {
            const raw = await targetField.getValue(id);
            text = typeof raw === 'string' ? raw : JSON.stringify(raw);
          }

          if (text && text.trim().includes('Xóa')) {
            toDelete.push(id);
          }
        }

        if (toDelete.length === 0) {
          print('Không có dòng nào chứa chữ "Xóa".');
          btn.disabled = false;
          return;
        }

        print(`Phát hiện ${toDelete.length} dòng có chữ "Xóa". Đang xóa...`);

        // Xóa lần lượt từng dòng nếu deleteRecords hàng loạt bị chặn quyền
        let successCount = 0;
        try {
          await table.deleteRecords(toDelete);
          successCount = toDelete.length;
        } catch (batchErr) {
          print('Xóa hàng loạt không được, chuyển sang xóa từng dòng...');
          for (const id of toDelete) {
            try {
              await table.deleteRecord(id);
              successCount++;
            } catch (singleErr) {
              print(`Lỗi xóa dòng ${id}: ${singleErr.message}`);
            }
          }
        }

        print(`Xong! Đã xóa thành công ${successCount} dòng.`);
      } catch (err) {
        print('Lỗi: ' + (err.message || JSON.stringify(err)));
      } finally {
        btn.disabled = false;
      }
    };
  </script>
</body>
</html>
