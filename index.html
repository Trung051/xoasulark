<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dọn dẹp lịch sử</title>
  <!-- Nhúng trực tiếp SDK chính thức của Lark Bitable -->
  <script src="https://unpkg.com/@lark-base-open/js-sdk@0.5.15/dist/index.umd.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
      margin: 0;
      background-color: #fff;
    }
    h3 {
      font-size: 16px;
      margin-top: 0;
      color: #1f2329;
    }
    p {
      font-size: 13px;
      color: #646a73;
      line-height: 1.5;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #d83931;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
    }
    button:disabled {
      background-color: #bbbfc4;
      cursor: not-allowed;
    }
    #status {
      margin-top: 12px;
      font-size: 13px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <h3>Dọn dẹp bản ghi hết hạn</h3>
  <p>Tự động quét cột <b>[Hết hạn (Xóa)]</b> có giá trị là <b>"Xóa"</b> và xóa khỏi bảng hiện tại.</p>
  <button id="btn-clean">Xóa các dòng quá hạn</button>
  <div id="status"></div>

  <script>
    const bitable = window.bitableSDK.bitable;
    const btn = document.getElementById('btn-clean');
    const status = document.getElementById('status');

    btn.onclick = async () => {
      try {
        btn.disabled = true;
        status.style.color = '#3370ff';
        status.innerText = 'Đang quét dữ liệu...';

        const table = await bitable.base.getActiveTable();
        const fieldList = await table.getFieldList();
        const targetField = fieldList.find(f => f.name === 'Hết hạn (Xóa)');

        if (!targetField) {
          status.style.color = '#d83931';
          status.innerText = 'Không tìm thấy cột [Hết hạn (Xóa)]!';
          btn.disabled = false;
          return;
        }

        const ids = await table.getRecordIdList();
        const toDelete = [];

        for (const id of ids) {
          const val = await targetField.getValue(id);
          if (val === 'Xóa' || (Array.isArray(val) && val[0]?.text === 'Xóa')) {
            toDelete.push(id);
          }
        }

        if (toDelete.length === 0) {
          status.style.color = '#008a00';
          status.innerText = 'Không có dòng nào quá hạn.';
        } else {
          status.innerText = `Đang xóa ${toDelete.length} dòng...`;
          await table.deleteRecords(toDelete);
          status.style.color = '#008a00';
          status.innerText = `Đã xóa thành công ${toDelete.length} dòng!`;
        }
      } catch (err) {
        status.style.color = '#d83931';
        status.innerText = 'Lỗi: ' + err.message;
      } finally {
        btn.disabled = false;
      }
    };
  </script>
</body>
</html>
