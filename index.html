<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dọn dẹp bản ghi</title>
  <script src="https://unpkg.com/@lark-base-open/js-sdk@0.5.15/dist/index.umd.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: sans-serif; padding: 16px; margin: 0; }
    button { width: 100%; padding: 11px; background: #d83931; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    #log { margin-top: 14px; padding: 10px; background: #f5f6f7; font-size: 12px; max-height: 250px; overflow-y: auto; white-space: pre-wrap; }
    .modal { display: none; position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 999; }
    .modal-box { background: #fff; padding: 20px; border-radius: 8px; width: 90%; text-align: center; }
    .modal-btns { display: flex; gap: 10px; margin-top: 15px; }
    .modal-btns button { flex: 1; padding: 8px; }
  </style>
</head>
<body>
  <button id="btn-scan">Quét & Xóa</button>
  <div id="log">Sẵn sàng (v1.3 - Debug)</div>

  <div id="modalConfirm" class="modal">
    <div class="modal-box">
      <h4 style="margin:0 0 10px">Xác nhận xóa</h4>
      <p id="modal-text">Bạn chắc chắn muốn xóa?</p>
      <div class="modal-btns">
        <button onclick="document.getElementById('modalConfirm').style.display='none'">Hủy</button>
        <button id="btn-ok" style="background:#d83931; color:#fff; border:none">Xóa luôn</button>
      </div>
    </div>
  </div>

  <script>
    const bitable = window.bitableSDK.bitable;
    const logEl = document.getElementById('log');
    let targetTable = null;
    let recordsToDelete = [];

    function log(msg) { logEl.innerText += '\n' + msg; logEl.scrollTop = logEl.scrollHeight; }

    document.getElementById('btn-scan').onclick = async () => {
      try {
        log('Đang lấy bảng...');
        targetTable = await bitable.base.getActiveTable();
        const fields = await targetTable.getFieldList();
        const colExpired = fields.find(f => f.name.includes('Hết hạn (Xóa)'));

        if (!colExpired) return log('LỖI: Không tìm thấy cột [Hết hạn (Xóa)]');

        const recordIds = await targetTable.getRecordIdList();
        log(`Tìm thấy ${recordIds.length} dòng. Đang đọc dữ liệu...`);
        recordsToDelete = [];

        for (let i = 0; i < recordIds.length; i++) {
          const id = recordIds[i];
          let text = '';
          
          // Đọc trực tiếp dữ liệu thô
          const val = await colExpired.getValue(id);
          
          if (val) {
            if (typeof val === 'string') text = val;
            else if (Array.isArray(val)) text = val.map(v => v.text || v.name || '').join('');
            else if (typeof val === 'object') text = val.text || JSON.stringify(val);
          }

          // In thử giá trị 3 dòng đầu tiên ra màn hình để debug
          if (i < 3) {
            log(`Dòng ${i+1} đọc được: "${text}"`);
          }

          if (text && text.includes('Xóa')) {
            recordsToDelete.push(id);
          }
        }

        if (recordsToDelete.length === 0) {
          return log('Quét xong. KHÔNG tìm thấy dòng nào chứa chữ "Xóa"!');
        }

        document.getElementById('modal-text').innerHTML = `Phát hiện <b>${recordsToDelete.length}</b> dòng có chữ Xóa. Xóa nhé?`;
        document.getElementById('modalConfirm').style.display = 'flex';
      } catch (err) {
        log('Lỗi: ' + err.message);
      }
    };

    document.getElementById('btn-ok').onclick = async () => {
      document.getElementById('modalConfirm').style.display = 'none';
      log(`Đang xóa ${recordsToDelete.length} dòng...`);
      let success = 0;
      for (const id of recordsToDelete) {
        try { await targetTable.deleteRecord(id); success++; } catch(e){}
      }
      log(`Đã xóa thành công: ${success} dòng.`);
    };
  </script>
</body>
</html>
